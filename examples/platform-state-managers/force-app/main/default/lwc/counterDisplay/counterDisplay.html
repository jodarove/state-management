<template>
    <div class="counter-display slds-card">
        <div class="slds-p-around_medium">
            <h2 class="slds-text-heading_medium slds-m-bottom_small">
                Counter State Manager
            </h2>
            
            <!-- Display the counter value -->
            <div class="slds-m-vertical_medium">
                <div class="slds-text-heading_large slds-align_absolute-center slds-m-bottom_small">
                    {counter}
                </div>
                <div class="slds-text-body_small slds-text-color_weak slds-align_absolute-center">
                    Counter Value
                </div>
            </div>

            <!-- Display the computed doubleCounter value -->
            <div class="slds-m-vertical_medium">
                <div class="slds-text-heading_medium slds-align_absolute-center slds-m-bottom_small">
                    {doubleCounter}
                </div>
                <div class="slds-text-body_small slds-text-color_weak slds-align_absolute-center">
                    Double Counter (Computed)
                </div>
            </div>

            <!-- Action buttons to increment and decrement -->
            <div class="slds-grid slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button
                        label="Decrement"
                        onclick={handleDecrement}
                        variant="neutral"
                        class="slds-size_full">
                    </lightning-button>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button
                        label="Increment"
                        onclick={handleIncrement}
                        variant="brand"
                        class="slds-size_full">
                    </lightning-button>
                </div>
            </div>

            <!-- Information section showing state manager capabilities -->
            <div class="slds-box slds-theme_info slds-m-top_medium">
                <div class="slds-text-heading_small slds-m-bottom_x-small">
                    State Manager Capabilities:
                </div>
                <ul class="slds-list_dotted">
                    <li>Reactive state updates - Counter and Double Counter update automatically</li>
                    <li>Computed properties - Double Counter is computed from Counter</li>
                    <li>Context-based sharing - State manager accessed via fromContext</li>
                    <li>Actions - Increment and Decrement operations modify state</li>
                </ul>
            </div>
        </div>
    </div>
</template>
